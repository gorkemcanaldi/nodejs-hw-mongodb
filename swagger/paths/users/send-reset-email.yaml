tags:
  - Users
summary: Request password reset email
operationId: requestResetMail
description: Sends an email with password reset instructions.
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          email:
            type: string
        required:
          - email
responses:
  '200':
    description: Reset email sent successfully
