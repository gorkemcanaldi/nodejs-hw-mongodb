tags:
  - Users
summary: Reset user password
operationId: resetPassword
description: Reset user password using token.
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          token:
            type: string
          password:
            type: string
        required:
          - token
          - password
responses:
  '200':
    description: Password successfully reset
