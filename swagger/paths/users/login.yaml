tags:
  - Users
summary: Login user
operationId: loginUser
description: Authenticate a user and receive access token.
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          email:
            type: string
          password:
            type: string
        required:
          - email
          - password
responses:
  '200':
    description: User successfully logged in
    content:
      application/json:
        schema:
          type: object
          properties:
            accessToken:
              type: string
  '401':
    description: Unauthorized
