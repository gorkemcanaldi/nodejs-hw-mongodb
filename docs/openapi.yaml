openapi: 3.1.0
info:
  version: 1.0.0
  title: Contacts API
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  description: >
    This API allows you to manage contacts. Includes CRUD operations.
tags:
  - name: Contacts
    description: Operations about contacts
  - name: Users
    description: User-related operations (authentication, profile)
servers:
  - url: http://localhost:3000
  - url: https://your-render-app-url.onrender.com
paths:
  /contacts:
    get:
      $ref: ../swagger/paths/contacts/get.yaml
    post:
      $ref: ../swagger/paths/contacts/post.yaml
  /contacts/{contactId}:
    get:
      $ref: ../swagger/paths/contacts/{contactId}/get.yaml
    patch:
      $ref: ../swagger/paths/contacts/{contactId}/patch.yaml
    delete:
      $ref: ../swagger/paths/contacts/{contactId}/delete.yaml
  /auth/register:
    post:
      $ref: ../swagger/paths/users/register.yaml
  /auth/login:
    post:
      $ref: ../swagger/paths/users/login.yaml
  /auth/refresh:
    post:
      $ref: ../swagger/paths/users/refresh.yaml
  /auth/logout:
    post:
      $ref: ../swagger/paths/users/logout.yaml
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Contact:
      $ref: ../swagger/components/schemas/contact.yaml#/Contact
    User:
      $ref: ../swagger/components/schemas/user.yaml#/User
security:
  - bearerAuth: []
